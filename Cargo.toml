[package]
name = "cargo-layers"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "A Cargo subcommand that checks which modules of a crate may reference each other"
repository = "https://github.com/AprilNEA/cargo-layers"
keywords = ["cargo", "subcommand", "architecture", "layers", "modules"]
categories = ["development-tools::cargo-plugins"]

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
all = "warn"

[dependencies]
anyhow = "1.0.104"
cargo_metadata = "0.23.1"
clap = { version = "4.6.7", features = ["derive"] }
proc-macro2 = { version = "1.0.107", features = ["span-locations"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
syn = { version = "3.0.9", features = ["full", "visit"] }
thiserror = "2.0.21"

[dev-dependencies]
tempfile = "3.27.0"
